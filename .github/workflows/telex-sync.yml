name: Telex.pk sync

# Phase 2A: the Telex.pk background sync, matching how daily-refresh.yml calls the other job
# endpoints. Runs once a day (ali approved turning this on, 2026-11-20) - the job itself still
# enforces its own kill switch (SYNC_TELEX_ENABLED), rate limiting and page cap server-side, so
# this schedule is just "ask once a day", not a guarantee of how much it actually fetches.
# Can also be run on demand from the Actions tab (Run workflow).
#
# Requires the same two repository secrets as daily-refresh.yml:
#   RENDER_API_URL  e.g. https://ex-comm-api.onrender.com
#   JOB_KEY         the same value as the Render service's JOB_KEY env var
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the API origin
        id: api
        run: |
          origin=$(echo "${{ secrets.RENDER_API_URL }}" | sed -E 's#^(https?://[^/]+).*#\1#')
          echo "api_url=$origin" >> "$GITHUB_OUTPUT"
          echo "Resolved host: $(echo "$origin" | sed -E 's#^https?://##')"

      - name: Wake the API
        run: curl -fsS --max-time 90 "${{ steps.api.outputs.api_url }}/api/health" || true

      - name: Run one Telex.pk sync batch
        run: |
          curl -fsS --max-time 150 -X POST "${{ steps.api.outputs.api_url }}/api/jobs/telex-sync" \
            -H "x-job-key: ${{ secrets.JOB_KEY }}"

name: Keep catalog prices and stock fresh

# Render's free plan spins the API down after 15 minutes idle, which stops the in-process cron jobs
# (catalog sync, price check) too - nothing keeps the dyno awake between visits, so listings can go
# stale for weeks. This workflow runs on GitHub's own schedule, independent of Render's uptime, and
# calls the job endpoints directly: the HTTP request itself wakes the dyno if it was asleep.
#
# Every 15 minutes - this repo is public, so Actions minutes are free and unlimited.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   RENDER_API_URL  e.g. https://ex-comm-api.onrender.com
#   JOB_KEY         the same value as the Render service's JOB_KEY env var
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # RENDER_API_URL has caused silent 404s before when it carried a trailing slash or an
      # extra path segment (e.g. ".../api/health/api/health" or ".../api/api/health"). Strip
      # everything but the scheme+host here so every later step uses the same clean origin, and
      # print just the host so a bad value is visible without ever printing the secret itself.
      - name: Resolve the API origin
        id: api
        run: |
          origin=$(echo "${{ secrets.RENDER_API_URL }}" | sed -E 's#^(https?://[^/]+).*#\1#')
          echo "api_url=$origin" >> "$GITHUB_OUTPUT"
          echo "Resolved host: $(echo "$origin" | sed -E 's#^https?://##')"

      - name: Wake the API
        run: curl -fsS --max-time 90 "${{ steps.api.outputs.api_url }}/api/health" || true

      - name: Run one catalog-sync batch
        run: |
          curl -fsS --max-time 60 -X POST "${{ steps.api.outputs.api_url }}/api/jobs/catalog-sync" \
            -H "x-job-key: ${{ secrets.JOB_KEY }}"

      - name: Run a price check for wishlisted/alerted products
        run: |
          curl -fsS --max-time 60 -X POST "${{ steps.api.outputs.api_url }}/api/jobs/price-check" \
            -H "x-job-key: ${{ secrets.JOB_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"mode":"live"}'

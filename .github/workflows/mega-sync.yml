name: Mega.pk sync

# Phase 2 Part F: the Mega.pk background sync, same job-endpoint pattern as telex-sync.yml/
# daily-refresh.yml. Deliberately workflow_dispatch-only for now, no cron schedule - this mirrors
# how Telex.pk's own sync first shipped (schedule added only in a later commit, once ali reviewed
# and approved it). Mega is a brand-new, never-before-hit site; the job's own kill switch
# (SYNC_MEGA_ENABLED, off by default) is the real gate either way, so even a schedule added here
# would stay a no-op until that's turned on - but not adding one yet is the more conservative choice.
# Run manually from the Actions tab (Run workflow) once ready to test it end to end.
#
# Requires the same two repository secrets as daily-refresh.yml/telex-sync.yml:
#   RENDER_API_URL  e.g. https://ex-comm-api.onrender.com
#   JOB_KEY         the same value as the Render service's JOB_KEY env var
on:
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve the API origin
        id: api
        run: |
          origin=$(echo "${{ secrets.RENDER_API_URL }}" | sed -E 's#^(https?://[^/]+).*#\1#')
          echo "api_url=$origin" >> "$GITHUB_OUTPUT"
          echo "Resolved host: $(echo "$origin" | sed -E 's#^https?://##')"

      - name: Wake the API
        run: curl -fsS --max-time 90 "${{ steps.api.outputs.api_url }}/api/health" || true

      - name: Run one Mega.pk sync batch
        run: |
          curl -fsS --max-time 150 -X POST "${{ steps.api.outputs.api_url }}/api/jobs/mega-sync" \
            -H "x-job-key: ${{ secrets.JOB_KEY }}"
